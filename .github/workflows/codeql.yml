name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly, so a newly published rule finds an old vulnerability even when
    # nobody has touched the code.
    - cron: '31 4 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # CodeQL publishes its findings to code scanning, which on a private
    # repository requires GitHub Advanced Security — a paid add-on. Without it
    # the upload fails with "Code scanning is not enabled for this repository"
    # no matter how clean the code is, so the job would be permanently red for
    # a reason that has nothing to do with the code.
    #
    # The guard skips instead of failing, and the analysis starts running on
    # its own the moment the repository becomes public or Advanced Security is
    # enabled. Meanwhile the Security job in ci.yml still runs secret scanning
    # and the dependency audit, both of which work on a private repository.
    if: github.event.repository.private == false

    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          queries: security-and-quality

      - name: Build
        working-directory: backend
        run: dotnet build FaceId.slnx --configuration Release

      - name: Analyse
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp
